# Google Cloud Build → Cloud Run (Joseph)
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "gcr.io/$PROJECT_ID/hodari-orchestrator:$SHORT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "gcr.io/$PROJECT_ID/hodari-orchestrator:$SHORT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hodari-orchestrator
      - --image=gcr.io/$PROJECT_ID/hodari-orchestrator:$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest,MONGODB_MCP_URL=MONGODB_MCP_URL:latest
      - --set-env-vars=MOCK_AGENTS=false,GEMINI_MODEL=gemini-2.0-flash
images:
  - gcr.io/$PROJECT_ID/hodari-orchestrator:$SHORT_SHA
