substitutions:
  _REGION: us-central1
  _SERVICE: hodari-backend
  _IMAGE: hodari-backend

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_IMAGE}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_IMAGE}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - gcr.io/$PROJECT_ID/${_IMAGE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --set-secrets
      - MONGODB_URI=MONGODB_URI:latest,MAPS_API_KEY=MAPS_API_KEY:latest,ROUTES_API_KEY=ROUTES_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest

images:
  - gcr.io/$PROJECT_ID/${_IMAGE}:$COMMIT_SHA
