apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hodari-explorer
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      timeoutSeconds: 300
      containers:
        - image: IMAGE_PLACEHOLDER   # replaced by deploy.sh
          env:
            - name: AGENT_SERVICE
              value: explorer
            - name: PORT
              value: "8080"
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            # Secrets injected at deploy time via --set-secrets in deploy.sh:
            #   GOOGLE_MAPS_API_KEY (Maps Grounding Lite MCP auth)
            #   MONGODB_MCP_URL     (MongoDB MCP HTTP server URL)
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"   # heavier: Maps MCP + Atlas Vector Search
          ports:
            - containerPort: 8080
